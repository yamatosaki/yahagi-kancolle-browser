name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest tool.test_check_repository_hygiene -v
      - run: python tool/check_repository_hygiene.py

  test:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: flutter pub get
      - run: python -m unittest tool.test_build_sortie_release tool.test_build_enemy_release tool.test_verify_data_release -v
      - run: dart run tool/verify_data_release.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Upload golden test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android :app:testDebugUnitTest --console=plain
      - run: flutter build apk --debug
      - name: Upload self-built debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yahagi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
